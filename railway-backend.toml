# Railway Deployment Configuration for SecureLens - Backend Service
# Reference: https://docs.railway.app

[build]
builder = "nixpacks"
# Build backend with all shared packages
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @securelens/constants build && pnpm --filter @securelens/findings-schema build && pnpm --filter @securelens/shared-types build && pnpm --filter @securelens/shared-utils build && cd apps/backend && pnpm prisma generate && pnpm run build"

[deploy]
# Start backend NestJS server
startCommand = "node apps/backend/dist/main.js"

healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
