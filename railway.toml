# Railway Deployment Configuration for SecureLens
# Reference: https://docs.railway.app

[build]
# Use nixpacks for automatic dependency detection
builder = "nixpacks"
# Build command for pnpm monorepo - includes Prisma client generation
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @securelens/constants build && pnpm --filter @securelens/findings-schema build && pnpm --filter @securelens/shared-types build && pnpm --filter @securelens/shared-utils build && cd apps/backend && pnpm prisma generate && pnpm run build && cd ../../apps/frontend && pnpm run build"

[deploy]
# Universal start script that detects service based on RAILWAY_SERVICE_NAME
startCommand = "bash start.sh"

# Health check endpoint
healthcheckPath = "/api/health"
healthcheckTimeout = 30

# Restart policy
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
