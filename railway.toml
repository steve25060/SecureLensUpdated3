# Railway Deployment Configuration for SecureLens
# Reference: https://docs.railway.app

[build]
# Use nixpacks for automatic dependency detection
builder = "nixpacks"
# Build command for pnpm monorepo
buildCommand = "pnpm install --frozen-lockfile && cd apps/backend && pnpm run build"

[deploy]
# Start command for the backend service
startCommand = "node apps/backend/dist/main.js"

# Health check endpoint
healthcheckPath = "/api/health"
healthcheckTimeout = 30

# Restart policy
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
