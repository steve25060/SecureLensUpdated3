# Railway Configuration for Frontend Service
# Use with: railway --config railway-frontend.toml

[build]
builder = "nixpacks"
# Build frontend with dependencies - skip TypeScript checking
buildCommand = "pnpm install --frozen-lockfile && cd apps/frontend && SKIP_ENV_VALIDATION=1 SKIP_TYPE_CHECK=1 pnpm run build"

[deploy]
# Start Next.js frontend
startCommand = "cd apps/frontend && pnpm start"

# Frontend uses port 3000
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
