# Railway Configuration for Frontend Service

[build]
builder = "nixpacks"
# Build frontend with public folder
buildCommand = "pnpm install --frozen-lockfile && cd apps/frontend && pnpm run build && cp -r public ../.next/standalone/apps/frontend/ 2>/dev/null || true"

[deploy]
# Start Next.js frontend
startCommand = "cd apps/frontend && pnpm start"

healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
